name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build skill zips
        run: |
          mkdir dist
          for dir in skills/*/; do
            skill=$(basename "$dir")
            (cd skills && zip -r "../dist/${skill}.zip" "${skill}/")
          done
          cd dist && zip vainu-skills.zip *.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" == refs/heads/* || "$tag" == "master" || "$tag" == "main" ]]; then
            tag="${{ inputs.tag }}"
          fi
          gh release create "$tag" dist/*.zip \
            --title "vainu-skills $tag" \
            --generate-notes
