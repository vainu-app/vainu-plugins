name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build skill zips
        run: |
          mkdir dist
          for dir in skills/*/; do
            skill=$(basename "$dir")
            (cd skills && zip -r "../dist/${skill}.zip" "${skill}/")
          done
          cd dist && zip vainu-skills.zip *.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --title "vainu-skills ${{ github.ref_name }}" \
            --generate-notes
