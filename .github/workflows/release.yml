name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0 or v1.0.0-rc.1)
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" == refs/heads/* || "$tag" == "master" || "$tag" == "main" ]]; then
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugins
        run: claude plugin validate .

      - name: Check manifest versions match the tag
        run: python3 -I scripts/check_release_version.py --tag "${{ steps.tag.outputs.tag }}"

      # One zip per plugin with the plugin folder as the single top-level
      # entry, which is what claude.ai's "Upload plugin" accepts.
      - name: Build plugin zips
        run: |
          mkdir dist
          for dir in plugins/*/; do
            plugin=$(basename "$dir")
            (cd plugins && zip -r "../dist/${plugin}.zip" "${plugin}/")
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          prerelease=()
          [[ "$tag" == *-* ]] && prerelease=(--prerelease)
          gh release create "$tag" dist/*.zip \
            --title "vainu-plugins $tag" \
            --generate-notes "${prerelease[@]}"
