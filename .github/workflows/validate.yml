name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # --strict is off on purpose: marketplace.json carries `policy`, a Codex
      # requirement that Claude Code reports as an unknown field.
      - name: Validate marketplace and plugins
        run: claude plugin validate .

      - name: Check every manifest carries the same version
        run: python3 -I scripts/check_release_version.py
